[package]
name = "overstory_devtools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Snapshot adapters and model helpers for Overstory devtools."
publish = false

[features]
default = []
spoor-session = ["dep:spoor_session"]
spoor-snapshot-session = ["spoor-session", "spoor_session/std"]
std = ["overstory/std"]
system-fonts = ["overstory/system-fonts"]

[dependencies]
overstory.workspace = true
spoor_session = { optional = true, workspace = true }

[dev-dependencies]
overstory = { features = ["system-fonts"], workspace = true }
understory_property.workspace = true

[lints]
workspace = true
