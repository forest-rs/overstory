[workspace]
resolver = "2"
members = [
    "apps/sightline",
    "examples/binding",
    "examples/hello",
    "looks/chicago",
    "looks/core",
    "looks/gallery",
    "looks/signature",
    "looks/system6",
    "overstory",
    "overstory_app",
    "overstory_demo",
    "overstory_demo_uikit",
    "overstory_devtools",
    "overstory_host",
    "overstory_host_appkit",
    "overstory_host_uikit",
    "overstory_host_wayland",
    "overstory_host_windows",
    "overstory_host_winit",
    "overstory_node_graph_demo",
    "overstory_presenter_wgpu",
    "overstory_svg",
    "overstory_transcript",
    "overstory_wind_tunnel",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Keep in sync with the relevant README.md files and with the MSRV in the
# `Unreleased` section of CHANGELOG.md.
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/forest-rs/overstory"

[workspace.dependencies]
# Overstory workspace crates.
overstory = { default-features = false, path = "overstory", version = "0.0.1" }
overstory_app = { default-features = false, path = "overstory_app", version = "0.0.1" }
overstory_demo = { default-features = false, path = "overstory_demo", version = "0.0.1" }
overstory_devtools = { path = "overstory_devtools", version = "0.0.1" }
overstory_host = { path = "overstory_host", version = "0.0.1" }
overstory_host_appkit = { path = "overstory_host_appkit", version = "0.0.1" }
overstory_host_uikit = { path = "overstory_host_uikit", version = "0.0.1" }
overstory_host_wayland = { path = "overstory_host_wayland", version = "0.0.1" }
overstory_host_windows = { path = "overstory_host_windows", version = "0.0.1" }
overstory_host_winit = { path = "overstory_host_winit", version = "0.0.1" }
overstory_look = { path = "looks/core", version = "0.0.1" }
overstory_look_chicago = { path = "looks/chicago", version = "0.0.1" }
overstory_look_signature = { path = "looks/signature", version = "0.0.1" }
overstory_look_system6 = { path = "looks/system6", version = "0.0.1" }
overstory_presenter_wgpu = { path = "overstory_presenter_wgpu", version = "0.0.1" }
overstory_svg = { path = "overstory_svg", version = "0.0.1" }
overstory_transcript = { path = "overstory_transcript", version = "0.0.1" }

# Core data deps
accesskit = { default-features = false, version = "0.24.0" }
accesskit_macos = { version = "0.26.1" }
accesskit_windows = { version = "0.33.1" }
chronostore = { default-features = false, git = "https://github.com/forest-rs/chronostore.git", rev = "f618fbf045db7767e4ca6c68e12b86a327447ad2" }
frameclock = { default-features = false, git = "https://github.com/forest-rs/subduction.git", rev = "4aad14addd5e13fb64cfc7308b933fe587db8856" }
frameclock_apple = { default-features = false, features = [
    "ca-display-link",
], git = "https://github.com/forest-rs/subduction.git", rev = "4aad14addd5e13fb64cfc7308b933fe587db8856" }
frameclock_wayland = { default-features = false, git = "https://github.com/forest-rs/subduction.git", rev = "4aad14addd5e13fb64cfc7308b933fe587db8856" }
frameclock_windows = { default-features = false, git = "https://github.com/forest-rs/subduction.git", rev = "4aad14addd5e13fb64cfc7308b933fe587db8856" }
hashbrown = { default-features = false, features = [
    "alloc",
    "default-hasher",
], version = "0.17.0" }
invalidation = { default-features = false, version = "0.2.0" }
kurbo = { default-features = false, features = ["libm"], version = "0.13.1" }
peniko = { default-features = false, features = ["libm"], version = "0.6.1" }
smallvec = { default-features = false, version = "1.13.2" }
spoor_session = { default-features = false, git = "https://github.com/forest-rs/spoor.git", rev = "42a84421d9fb1251b21d92882f402a90d42ca6f0" }
subduction_core = { default-features = false, git = "https://github.com/forest-rs/subduction.git", rev = "4aad14addd5e13fb64cfc7308b933fe587db8856" }

# Understory primitives.
understory_anchor = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_animation = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_animation_timeline = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_axis = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_box_tree = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_event_state = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_focus = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_motion = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_node_graph = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_outline = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_overlay = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_precise_hit = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_presentation = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_presentation_properties = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_property = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_property_binding = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_responder = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_selection = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_style = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_timeline_model = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_timing = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_transition = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_transcript = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_view2d = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }
understory_virtual_list = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "52d9c442a2119198b4323e1dc09d6a9e2aed0c4c" }

# Imaging — rendering backend.
imaging = { default-features = false, features = ["libm"], version = "0.0.1" }
imaging_vello = { default-features = false, features = ["vello-0-9"], version = "0.0.2" }
imaging_wgpu = { default-features = false, features = ["wgpu-29"], version = "0.0.2" }

# Input event normalization.
cursor-icon = { default-features = false, features = ["alloc"], version = "1.2.0" }
ui-events = { default-features = false, features = ["kurbo"], git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
ui-events-appkit = { git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
ui-events-uikit = { git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
ui-events-wayland = { features = ["xkb"], git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
ui-events-windows = { git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
ui-events-winit = { git = "https://github.com/forest-rs/ui-events.git", rev = "4a993e74196079c2305a9b784fa250b23efa2527" }
usvg = { default-features = false, version = "0.47.0" }
web-time = { version = "1.1.0" }

# DESIGN.md token parsing (looks). `default-features = false` drops the
# `encoding` feature (and the heavy `encoding_rs` dep); we only parse UTF-8 `&str`.
yaml-rust2 = { default-features = false, version = "0.11.0" }

# Layout engine.
taffy = { default-features = false, features = [
    "block_layout",
    "calc",
    "content_size",
    "flexbox",
    "float_layout",
    "grid",
    "taffy_tree",
], version = "0.10" }

# Text shaping and layout.
parley = { default-features = false, features = ["libm"], version = "0.9" }

# Host runtime for the demo binary.
accesskit_winit = { version = "0.32.2" }
pollster = { version = "0.4.0" }
wgpu = { default-features = false, features = ["std"], version = "29.0.3" }
winit = { default-features = true, version = "0.30" }

[workspace.lints]
# LINEBENDER LINT SET - Cargo.toml - v7
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_code = "deny"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.default_trait_access = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"

[profile.ci.package."*"]
debug-assertions = true
