[workspace]
resolver = "2"
members = [
    "overstory",
    "overstory_demo",
    "overstory_devtools",
    "overstory_host",
    "overstory_host_winit",
    "overstory_node_graph_demo",
    "overstory_svg",
    "overstory_wind_tunnel",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# Keep in sync with the relevant README.md files and with the MSRV in the
# `Unreleased` section of CHANGELOG.md.
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/forest-rs/overstory"

[workspace.dependencies]
# Overstory workspace crates.
overstory = { default-features = false, path = "overstory", version = "0.0.1" }
overstory_devtools = { path = "overstory_devtools", version = "0.0.1" }
overstory_host = { path = "overstory_host", version = "0.0.1" }
overstory_host_winit = { path = "overstory_host_winit", version = "0.0.1" }
overstory_svg = { path = "overstory_svg", version = "0.0.1" }

# Core data deps
accesskit = { default-features = false, version = "0.24.0" }
hashbrown = { default-features = false, features = [
    "alloc",
    "default-hasher",
], version = "0.17.0" }
invalidation = { default-features = false, version = "0.2.0" }
kurbo = { default-features = false, features = ["libm"], version = "0.13.1" }
peniko = { default-features = false, features = ["libm"], version = "0.6.1" }
smallvec = { default-features = false, version = "1.13.2" }
spoor_session = { default-features = false, git = "https://github.com/forest-rs/spoor.git", rev = "42a84421d9fb1251b21d92882f402a90d42ca6f0" }
subduction_core = { default-features = false, git = "https://github.com/forest-rs/subduction.git", rev = "fd26c7acb332ff0668a040010093f0c3318233c0" }

# Understory primitives.
understory_axis = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_box_tree = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_event_state = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_focus = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_node_graph = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_outline = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_precise_hit = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_presentation = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_property = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_property_binding = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_responder = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_selection = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_style = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_timing = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_view2d = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }
understory_virtual_list = { default-features = false, git = "https://github.com/forest-rs/understory.git", rev = "9125d622a386ad60c25ff2e73491e0ee9c100b51" }

# Imaging — rendering backend.
imaging = { default-features = false, features = ["libm"], version = "0.0.1" }
imaging_vello = { default-features = false, features = ["vello-0-9"], version = "0.0.2" }
imaging_wgpu = { default-features = false, features = ["wgpu-29"], version = "0.0.2" }

# Input event normalization.
cursor-icon = { default-features = false, features = ["alloc"], version = "1.2.0" }
ui-events = { default-features = false, features = ["kurbo"], version = "0.3" }
ui-events-winit = { version = "0.3" }
usvg = { default-features = false, version = "0.47.0" }
web-time = { version = "1.1.0" }

# Layout engine.
taffy = { default-features = false, features = [
    "block_layout",
    "calc",
    "content_size",
    "flexbox",
    "float_layout",
    "grid",
    "taffy_tree",
], version = "0.10" }

# Text shaping and layout.
parley = { default-features = false, features = ["libm"], version = "0.9" }

# Host runtime for the demo binary.
accesskit_winit = { version = "0.32.2" }
pollster = { version = "0.4.0" }
wgpu = { default-features = false, features = ["std"], version = "29.0.3" }
winit = { default-features = true, version = "0.30" }

[workspace.lints]
# LINEBENDER LINT SET - Cargo.toml - v7
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_code = "deny"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.default_trait_access = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

[profile.ci]
inherits = "dev"
debug = 0
strip = "debuginfo"

[profile.ci.package."*"]
debug-assertions = true
