[package]
name = "overstory_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Application runner facade for Overstory native hosts."
publish = false

[features]
default = ["winit-host"]
appkit-host = ["dep:overstory_host_appkit"]
winit-host = ["dep:overstory_host_winit"]

[dependencies]
overstory_host_appkit = { optional = true, workspace = true }
overstory_host_winit = { optional = true, workspace = true }

[lints]
workspace = true
