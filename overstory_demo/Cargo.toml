[package]
name = "overstory_demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Demo binary for Overstory native hosts."
publish = false

[features]
default = ["winit-host"]
appkit-host = ["overstory_app/appkit-host"]
winit-host = ["overstory_app/winit-host"]

[dependencies]
frameclock.workspace = true
overstory = { features = ["system-fonts"], workspace = true }
overstory_app = { default-features = false, workspace = true }
overstory_devtools = { features = ["spoor-snapshot-session"], workspace = true }
overstory_svg.workspace = true
overstory_transcript.workspace = true
peniko.workspace = true
ui-events.workspace = true
understory_style.workspace = true
understory_view2d.workspace = true

[dev-dependencies]
kurbo.workspace = true
understory_property.workspace = true

[lints]
workspace = true
