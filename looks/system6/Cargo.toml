[package]
name = "overstory_look_system6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "System 6: a 1-bit black-and-white classic Mac look for Overstory."
publish = false

[dependencies]
overstory.workspace = true
overstory_look.workspace = true
understory_style = { default-features = false, workspace = true }
understory_timing = { default-features = false, workspace = true }
peniko.workspace = true

[dev-dependencies]
# Tests construct a `Ui` (gated behind `system-fonts`); the example also needs a host.
overstory = { features = ["system-fonts"], workspace = true }
overstory_app = { default-features = false, features = ["winit-host"], workspace = true }

# Distinct binary name so it doesn't collide with other looks' examples.
[[example]]
name = "system6_showcase"
path = "examples/showcase.rs"

[lints]
workspace = true
