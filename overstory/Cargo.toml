[package]
name = "overstory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WPF / WinUI 3-inspired UI toolkit built on understory and imaging."
publish = false

[features]
default = ["system-fonts"]
std = [
    "cursor-icon/std",
    "imaging/std",
    "kurbo/std",
    "parley/std",
    "peniko/std",
    "subduction_core/std",
    "taffy/std",
    "ui-events/std",
    "understory_box_tree/std",
    "understory_event_state/std",
    "understory_focus/std",
    "understory_presentation/std",
    "understory_responder/std",
]
system-fonts = ["std", "parley/system"]

[dependencies]
hashbrown.workspace = true
invalidation.workspace = true
smallvec.workspace = true
kurbo.workspace = true
peniko.workspace = true
subduction_core.workspace = true

cursor-icon.workspace = true
imaging.workspace = true

understory_axis = { workspace = true, default-features = false }
understory_box_tree = { workspace = true, default-features = false, features = ["libm"] }
understory_event_state = { workspace = true, default-features = false, features = ["libm", "click", "drag"] }
understory_focus = { workspace = true, default-features = false, features = ["libm", "box_tree_adapter"] }
understory_presentation = { workspace = true, default-features = false, features = ["libm"] }
understory_property = { workspace = true, default-features = false }
understory_property_binding = { workspace = true, default-features = false }
understory_responder = { workspace = true, default-features = false, features = ["box_tree_adapter"] }
understory_selection = { workspace = true, default-features = false }
understory_style = { workspace = true, default-features = false }
understory_timing = { workspace = true, default-features = false }
understory_virtual_list = { workspace = true, default-features = false }

ui-events.workspace = true
taffy.workspace = true
parley.workspace = true

[lints]
workspace = true
