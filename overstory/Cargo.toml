[package]
name = "overstory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WPF / WinUI 3-inspired UI toolkit built on understory and imaging."
publish = false

[features]
default = ["system-fonts"]
std = [
    "cursor-icon/std",
    "imaging/std",
    "kurbo/std",
    "parley/std",
    "peniko/std",
    "subduction_core/std",
    "taffy/std",
    "ui-events/std",
    "understory_box_tree/std",
    "understory_event_state/std",
    "understory_focus/std",
    "understory_presentation/std",
    "understory_responder/std",
]
system-fonts = ["std", "parley/system"]

[dependencies]
accesskit.workspace = true
hashbrown.workspace = true
invalidation.workspace = true
kurbo.workspace = true
peniko.workspace = true
smallvec.workspace = true
subduction_core.workspace = true

cursor-icon.workspace = true
imaging.workspace = true

understory_axis = { default-features = false, workspace = true }
understory_box_tree = { default-features = false, features = ["libm"], workspace = true }
understory_event_state = { default-features = false, features = ["click", "drag", "libm"], workspace = true }
understory_focus = { default-features = false, features = ["box_tree_adapter", "libm"], workspace = true }
understory_presentation = { default-features = false, features = ["libm"], workspace = true }
understory_property = { default-features = false, workspace = true }
understory_property_binding = { default-features = false, workspace = true }
understory_responder = { default-features = false, features = ["box_tree_adapter"], workspace = true }
understory_selection = { default-features = false, workspace = true }
understory_style = { default-features = false, workspace = true }
understory_timing = { default-features = false, workspace = true }
understory_virtual_list = { default-features = false, workspace = true }

parley.workspace = true
taffy.workspace = true
ui-events.workspace = true

[lints]
workspace = true
