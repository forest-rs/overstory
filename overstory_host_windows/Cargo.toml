[package]
name = "overstory_host_windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows native host for Overstory applications."
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
overstory = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
frameclock.workspace = true
frameclock_windows.workspace = true
overstory_host.workspace = true
overstory_presenter_wgpu.workspace = true
ui-events.workspace = true
ui-events-windows.workspace = true
wgpu.workspace = true

windows = {
  version = "0.62.2",
  features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
  ]
}

[lints]
workspace = true
